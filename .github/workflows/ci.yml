name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build e testes
        run: chmod +x mvnw && ./mvnw -B verify
        env:
          API_SECURITY_TOKEN_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: biblioteca-${{ github.sha }}
          path: target/biblioteca-*.jar
          if-no-files-found: error
